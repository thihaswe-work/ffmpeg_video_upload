<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 12; }
      .box-store { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 12; }
      .box-db { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 12; }
      .title { fill: #0f172a; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .sub { fill: #334155; font-size: 12px; text-anchor: middle; }
      .lbl { fill: #1e293b; font-size: 12px; font-weight: 600; }
      .lbl-muted { fill: #64748b; font-size: 11px; }
      .flow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .flow-back { fill: none; stroke: #0ea5e9; stroke-width: 2; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .h1 { fill: #0f172a; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .legend { fill: #475569; font-size: 11px; }
    </style>
  </defs>

  <text x="560" y="34" class="h1">Video Upload &amp; Streaming — Architecture</text>

  <!-- Frontend -->
  <rect class="box" x="30" y="120" width="200" height="140" />
  <text x="130" y="150" class="title">Frontend</text>
  <text x="130" y="172" class="sub">React + Vite</text>
  <text x="130" y="198" class="sub">• UploadPage</text>
  <text x="130" y="218" class="sub">• VideoListPage</text>
  <text x="130" y="238" class="sub">• Player (hls.js)</text>

  <!-- Backend -->
  <rect class="box" x="300" y="120" width="220" height="140" />
  <text x="410" y="150" class="title">Backend API</text>
  <text x="410" y="172" class="sub">FastAPI</text>
  <text x="410" y="198" class="sub">POST /api/videos/upload</text>
  <text x="410" y="218" class="sub">GET /api/videos/</text>
  <text x="410" y="238" class="sub">streams file → temp disk</text>

  <!-- Worker / FFmpeg -->
  <rect class="box" x="580" y="120" width="220" height="140" />
  <text x="690" y="150" class="title">Background Job</text>
  <text x="690" y="172" class="sub">FFmpeg</text>
  <text x="690" y="198" class="sub">• thumbnail @ 1s</text>
  <text x="690" y="218" class="sub">• HLS 1080/720/480</text>
  <text x="690" y="238" class="sub">master.m3u8 + .ts</text>

  <!-- Spaces -->
  <rect class="box-store" x="860" y="120" width="210" height="140" />
  <text x="965" y="150" class="title">DigitalOcean</text>
  <text x="965" y="170" class="title">Spaces</text>
  <text x="965" y="196" class="sub">videos/{id}/</text>
  <text x="965" y="216" class="sub">master.m3u8, .ts</text>
  <text x="965" y="236" class="sub">thumbnail.jpg</text>

  <!-- Database -->
  <rect class="box-db" x="300" y="330" width="220" height="100" />
  <text x="410" y="360" class="title">PostgreSQL</text>
  <text x="410" y="384" class="sub">videos(id,</text>
  <text x="410" y="402" class="sub">thumbnail_key,</text>
  <text x="410" y="420" class="sub">manifest_key, status)</text>

  <!-- Arrows -->
  <path class="flow" d="M230,160 L300,160" />
  <text x="265" y="150" class="lbl" text-anchor="middle">1</text>

  <path class="flow" d="M300,210 L230,210" />
  <text x="265" y="228" class="lbl" text-anchor="middle">2</text>

  <path class="flow" d="M520,160 L580,160" />
  <text x="550" y="150" class="lbl" text-anchor="middle">3</text>

  <path class="flow" d="M800,160 L860,160" />
  <text x="830" y="150" class="lbl" text-anchor="middle">4</text>

  <path class="flow" d="M380,260 L380,330" />
  <text x="388" y="300" class="lbl">5</text>

  <path class="flow" d="M690,260 L690,300 L460,300 L460,260" />
  <text x="575" y="315" class="lbl" text-anchor="middle">6</text>

  <path class="flow-back" d="M965,260 L965,480 L130,480 L130,260" />
  <text x="560" y="500" class="lbl" text-anchor="middle">7  Playback: hls.js fetches master.m3u8 from Spaces &amp; poster from thumbnail.jpg</text>

  <!-- Legend -->
  <text x="30" y="70" class="lbl-muted">1 multipart POST (MP4)   ·   2 202 { id, status:"processing" }   ·   3 queue background task   ·   4 upload HLS + thumbnail   ·   5 save DB row   ·   6 status → completed/failed</text>
</svg>
